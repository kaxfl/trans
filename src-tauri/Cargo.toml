[package]
name = "tauri-app"
version = "2.1.1"
description = "即时翻译 — 划词翻译 / 本地词典 / 代码标识符拆词"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "charset"] }
async-trait = "0.1"
# 只为了给 UIA 调用套超时（UIA 可能无限期阻塞）
tokio = { version = "1", features = ["time"] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Globalization",
    "Storage_Streams",
    "Foundation_Collections",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }
tauri-plugin-global-shortcut = "2.3.2"
sha2 = "0.11.0"
winreg = "0.56.0"
tauri-plugin-single-instance = "2.4.4"
# 本地词典用 mmap 打开（56 万条不读进内存，查询微秒级）
memmap2 = "0.9"
